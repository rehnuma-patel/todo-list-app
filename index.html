<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List | Rehnumabanu Patel</title>
  <meta name="description" content="A to-do list app to add, edit, complete and delete tasks. Tasks are saved in your browser with localStorage." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span></div>

  <main class="app">
    <div class="top-bar">
      <a href="https://rehnuma-patel.github.io/internship-portfolio/#projects" class="back"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
    </div>

    <header class="app-header">
      <div class="logo"><i class="fa-solid fa-list-check"></i></div>
      <div>
        <h1>My Tasks</h1>
        <p class="today" id="today"></p>
      </div>
    </header>

    <!-- ===== PROGRESS ===== -->
    <section class="progress-card" aria-label="Progress">
      <div class="progress-text">
        <span id="progress-label">No tasks yet</span>
        <strong id="progress-percent">0%</strong>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </section>

    <!-- ===== ADD TASK ===== -->
    <form class="add-form" id="add-form" novalidate>
      <div class="add-row">
        <label for="task-input" class="sr-only">New task</label>
        <input type="text" id="task-input" placeholder="What do you need to do?" maxlength="120" autocomplete="off" />
        <button type="submit" class="btn-add" aria-label="Add task"><i class="fa-solid fa-plus"></i><span>Add</span></button>
      </div>
      <div class="add-options">
        <label class="option">
          <i class="fa-solid fa-flag"></i>
          <span class="sr-only">Priority</span>
          <select id="priority-input">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="high">High priority</option>
          </select>
        </label>
        <label class="option">
          <i class="fa-regular fa-calendar"></i>
          <span class="sr-only">Due date</span>
          <input type="date" id="due-input" />
        </label>
      </div>
      <small class="form-error" id="form-error" role="alert"></small>
    </form>

    <!-- ===== TOOLBAR ===== -->
    <div class="toolbar">
      <div class="filters" role="tablist" aria-label="Filter tasks">
        <button type="button" class="filter-btn active" data-filter="all">All <span class="count" id="count-all">0</span></button>
        <button type="button" class="filter-btn" data-filter="active">Active <span class="count" id="count-active">0</span></button>
        <button type="button" class="filter-btn" data-filter="completed">Done <span class="count" id="count-completed">0</span></button>
      </div>
      <label class="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span class="sr-only">Search tasks</span>
        <input type="search" id="search-input" placeholder="Search tasks" />
      </label>
    </div>

    <!-- ===== TASK LIST ===== -->
    <ul class="task-list" id="task-list" aria-live="polite"></ul>

    <div class="empty-state" id="empty-state" hidden>
      <i class="fa-regular fa-face-smile-beam"></i>
      <p id="empty-text">No tasks yet. Add your first one above!</p>
    </div>

    <footer class="app-footer">
      <span id="items-left">0 tasks left</span>
      <button type="button" class="link-btn" id="clear-completed"><i class="fa-solid fa-broom"></i> Clear completed</button>
    </footer>

    <p class="hint"><i class="fa-solid fa-floppy-disk"></i> Tasks are saved in your browser (localStorage). Double-click a task to edit it.</p>
  </main>

  <!-- ===== UNDO TOAST ===== -->
  <div class="toast" id="toast" role="status">
    <span id="toast-text">Task deleted</span>
    <button type="button" id="undo-btn">Undo</button>
  </div>

  <!-- ===== TASK TEMPLATE ===== -->
  <template id="task-template">
    <li class="task">
      <label class="check">
        <input type="checkbox" class="task-check" />
        <span class="checkmark"><i class="fa-solid fa-check"></i></span>
      </label>
      <div class="task-body">
        <p class="task-text"></p>
        <input type="text" class="task-edit" maxlength="120" hidden />
        <div class="task-meta">
          <span class="chip priority"></span>
          <span class="chip due" hidden><i class="fa-regular fa-calendar"></i> <span class="due-text"></span></span>
        </div>
      </div>
      <div class="task-actions">
        <button type="button" class="icon-btn edit-btn" aria-label="Edit task"><i class="fa-solid fa-pen"></i></button>
        <button type="button" class="icon-btn delete-btn" aria-label="Delete task"><i class="fa-solid fa-trash"></i></button>
      </div>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
