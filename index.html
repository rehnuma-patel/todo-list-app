<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow To-Do List | Rehnumabanu Patel</title>
  <meta name="description" content="A to-do list app to add, edit, complete and delete tasks. Tasks are saved in your browser with localStorage." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-list-check"></i></div>
        <span>TaskFlow</span>
        <button type="button" class="icon-btn close-sidebar" id="close-sidebar" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <nav class="menu" aria-label="Task views">
        <p class="menu-title">Tasks</p>
        <button type="button" class="menu-item active" data-filter="all"><i class="fa-solid fa-inbox"></i> All tasks <span class="count" id="count-all">0</span></button>
        <button type="button" class="menu-item" data-filter="active"><i class="fa-regular fa-circle"></i> Active <span class="count" id="count-active">0</span></button>
        <button type="button" class="menu-item" data-filter="completed"><i class="fa-regular fa-circle-check"></i> Completed <span class="count" id="count-completed">0</span></button>

        <p class="menu-title">Smart views</p>
        <button type="button" class="menu-item" data-filter="today"><i class="fa-regular fa-sun"></i> Due today <span class="count" id="count-today">0</span></button>
        <button type="button" class="menu-item" data-filter="overdue"><i class="fa-regular fa-clock"></i> Overdue <span class="count" id="count-overdue">0</span></button>
        <button type="button" class="menu-item" data-filter="high"><i class="fa-solid fa-fire"></i> High priority <span class="count" id="count-high">0</span></button>
      </nav>

      <!-- Progress ring -->
      <section class="progress-card" aria-label="Progress">
        <div class="ring" id="ring">
          <span id="progress-percent">0%</span>
        </div>
        <div>
          <strong>Your progress</strong>
          <p id="progress-label">No tasks yet</p>
        </div>
      </section>

      <div class="sidebar-footer">
        <button type="button" class="side-link" id="theme-toggle"><i class="fa-solid fa-moon"></i> <span>Dark mode</span></button>
        <a href="https://rehnuma-patel.github.io/internship-portfolio/#projects" class="side-link"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
      </div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <!-- ===== MAIN ===== -->
    <main class="main">
      <header class="topbar">
        <button type="button" class="icon-btn open-sidebar" id="open-sidebar" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
        <div>
          <h1 id="greeting">Hello 👋</h1>
          <p class="today" id="today"></p>
        </div>
      </header>

      <!-- Add task -->
      <form class="add-form" id="add-form" novalidate>
        <div class="add-row">
          <span class="add-icon"><i class="fa-solid fa-plus"></i></span>
          <label for="task-input" class="sr-only">New task</label>
          <input type="text" id="task-input" placeholder="Add a new task…" maxlength="120" autocomplete="off" />
        </div>
        <div class="add-options">
          <label class="option">
            <i class="fa-solid fa-flag"></i>
            <span class="sr-only">Priority</span>
            <select id="priority-input">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label class="option">
            <i class="fa-regular fa-calendar"></i>
            <span class="sr-only">Due date</span>
            <input type="date" id="due-input" />
          </label>
          <button type="submit" class="btn-add"><i class="fa-solid fa-plus"></i> Add task</button>
        </div>
        <small class="form-error" id="form-error" role="alert"></small>
      </form>

      <!-- Toolbar -->
      <div class="toolbar">
        <h2 id="view-title">All tasks</h2>
        <div class="toolbar-controls">
          <label class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span class="sr-only">Search tasks</span>
            <input type="search" id="search-input" placeholder="Search" />
          </label>
          <label class="option">
            <i class="fa-solid fa-arrow-down-wide-short"></i>
            <span class="sr-only">Sort by</span>
            <select id="sort-input">
              <option value="newest">Newest</option>
              <option value="due">Due date</option>
              <option value="priority">Priority</option>
            </select>
          </label>
        </div>
      </div>

      <!-- Task list -->
      <ul class="task-list" id="task-list" aria-live="polite"></ul>

      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-icon"><i class="fa-regular fa-face-smile-beam"></i></div>
        <h3 id="empty-title">No tasks yet</h3>
        <p id="empty-text">Add your first task above to get started.</p>
      </div>

      <footer class="list-footer">
        <span id="items-left">0 tasks left</span>
        <button type="button" class="link-btn" id="clear-completed"><i class="fa-solid fa-broom"></i> Clear completed</button>
      </footer>

      <p class="hint"><i class="fa-solid fa-floppy-disk"></i> Tasks are saved in your browser (localStorage). Double-click a task to edit it.</p>
    </main>
  </div>

  <!-- ===== UNDO TOAST ===== -->
  <div class="toast" id="toast" role="status">
    <span id="toast-text">Task deleted</span>
    <button type="button" id="undo-btn">Undo</button>
  </div>

  <!-- ===== TASK TEMPLATE ===== -->
  <template id="task-template">
    <li class="task">
      <label class="check">
        <input type="checkbox" class="task-check" />
        <span class="checkmark"><i class="fa-solid fa-check"></i></span>
      </label>
      <div class="task-body">
        <p class="task-text"></p>
        <input type="text" class="task-edit" maxlength="120" hidden />
        <div class="task-meta">
          <span class="chip priority"><i class="fa-solid fa-flag"></i> <span class="priority-text"></span></span>
          <span class="chip due" hidden><i class="fa-regular fa-calendar"></i> <span class="due-text"></span></span>
        </div>
      </div>
      <div class="task-actions">
        <button type="button" class="icon-btn edit-btn" aria-label="Edit task"><i class="fa-solid fa-pen"></i></button>
        <button type="button" class="icon-btn delete-btn" aria-label="Delete task"><i class="fa-solid fa-trash"></i></button>
      </div>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
